apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

// Personal settings live in the git-ignored local.properties
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) localPropertiesFile.withInputStream { localProperties.load(it) }

android {
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    defaultConfig {
        applicationId "app.rlauncher"
        minSdkVersion 24
        targetSdkVersion 36
        versionCode 113
        versionName "v6.9.17"

        resourceConfigurations += ["en", "ar", "cs", "da", "de", "el", "es-rES", "es-rUS", "fi", "fr", "he", "hi", "hr", "hu", "in", "it", "ja", "ko", "nb", "nl", "pl", "pt-rBR", "ro", "ru-rRU", "sv", "th", "tr", "uk", "vi", "zh"]
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "KUMA_STATUS_URL", "\"${localProperties.getProperty('rlauncher.kumaStatusUrl', '')}\""
        buildConfigField "String", "GEMMA_MONITOR", "\"${localProperties.getProperty('rlauncher.gemmaMonitor', '')}\""
        buildConfigField "String", "TUYA_ACCESS_ID", "\"${localProperties.getProperty('rlauncher.tuyaAccessId', '')}\""
        buildConfigField "String", "TUYA_ACCESS_SECRET", "\"${localProperties.getProperty('rlauncher.tuyaAccessSecret', '')}\""
        buildConfigField "String", "TUYA_REGION", "\"${localProperties.getProperty('rlauncher.tuyaRegion', 'eu')}\""
        buildConfigField "String", "PLUGS", "\"${localProperties.getProperty('rlauncher.plugs', '')}\""
        buildConfigField "String", "WEATHER_FALLBACK", "\"${localProperties.getProperty('rlauncher.weatherFallback', '')}\""
        buildConfigField "String", "WIREGUARD_TUNNEL", "\"${localProperties.getProperty('rlauncher.wireguardTunnel', '')}\""
    }

    buildTypes {
        release {
            debuggable false
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
            minifyEnabled false
            applicationIdSuffix ".debug"
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        viewBinding = true
        buildConfig = true
    }
    dependenciesInfo {
        includeInApk = false
        includeInBundle = true
    }
    namespace 'app.olauncher'
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation libs.kotlin.stdlib
    implementation libs.core.ktx
    implementation libs.appcompat
    implementation libs.recyclerview

    // Android lifecycle
    implementation libs.lifecycle.extensions
    implementation libs.lifecycle.viewmodel.ktx

    // Navigation
    implementation libs.navigation.fragment.ktx

    // Work Manager
    implementation libs.work.runtime.ktx

    //Material dependency
    implementation libs.material

    testImplementation libs.junit
}
